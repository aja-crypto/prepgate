name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-jwt-secret-not-real
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-real
          MONGO_URI: mongodb://localhost:27017/gatenexa-test
          MONGODB_URI: mongodb://localhost:27017/gatenexa-test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile exists
        run: |
          if [ ! -f Dockerfile ] && [ ! -f backend/Dockerfile ] && [ ! -f frontend/Dockerfile ]; then
            echo "No Dockerfile found — skipping (correct, no Docker architecture in repo)"
            exit 0
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker images (no push)
        run: |
          for f in Dockerfile backend/Dockerfile frontend/Dockerfile; do
            if [ -f "$f" ]; then echo "Building $f"; docker build -f "$f" . --tag test:ci || exit 1; fi
          done
